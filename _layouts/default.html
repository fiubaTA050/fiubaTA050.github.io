<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'es' }}">

  {%- include head.html -%}

  <body class="min-vh-100 d-flex flex-column h-100">

    {%- include navbar.html -%}

    {%- comment -%}
      `layout.main_class`, no `page.main_class`: el front matter de un layout
      se expone bajo `layout`, así que con `page` esto nunca resolvía a nada.
    {%- endcomment -%}
    <main class="flex-shrink-0{% if layout.main_class %} {{ layout.main_class }}{% endif %}">
      {{ content }}
    </main>

    {%- include footer.html -%}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
  </body>

</html>
